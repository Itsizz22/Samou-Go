<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#047857" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" type="image/png" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%COMPONENT_NAME%</title>
    <script>
      (function () {
        try {
          var m = localStorage.getItem('samou_theme') || 'system';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (m !== 'light' && m !== 'dark' && m !== 'system') {
            dark = localStorage.getItem('samou-go.store-manager-dark') === '1' ||
              localStorage.getItem('samou-go.captain-dark') === '1' ||
              localStorage.getItem('samou-go.admin-dark') === '1' ||
              localStorage.getItem('samou.theme.mode') === 'dark';
          }
          if (dark) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
