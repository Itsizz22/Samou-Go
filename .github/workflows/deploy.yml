name: Deploy Production

on:
  push:
    branches:
      - master

env:
  NODE_VERSION: 22

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy Production
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4

      # ============================================================
      # 2. Node.js
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # ============================================================
      # 3. Install dependencies (root, all workspaces)
      # ============================================================
      - name: Install Dependencies
        run: npm ci

      # ============================================================
      # 4. Build shared packages
      # ============================================================
      - name: Build shared packages
        run: |
          npm run build --workspace @samou-go/shared-types
          npm run build --workspace @samou-go/ui

      # ============================================================
      # 5. Generate Prisma production client
      # ============================================================
      - name: Generate Prisma Client
        working-directory: packages/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma generate --schema=prisma/schema.prisma

      # ============================================================
      # 6. Build API
      # ============================================================
      - name: Build API
        run: npm run build --workspace @samou-go/api

      # ============================================================
      # 7. Verify required secrets
      # ============================================================
      - name: Verify required secrets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID_WEB_CUSTOMER: ${{ secrets.VERCEL_PROJECT_ID_WEB_CUSTOMER }}
          VERCEL_PROJECT_ID_WEB_CHECKOUT: ${{ secrets.VERCEL_PROJECT_ID_WEB_CHECKOUT }}
          VERCEL_PROJECT_ID_WEB_STORE_DETAILS: ${{ secrets.VERCEL_PROJECT_ID_WEB_STORE_DETAILS }}
          VERCEL_PROJECT_ID_WEB_ORDER_TRACKING: ${{ secrets.VERCEL_PROJECT_ID_WEB_ORDER_TRACKING }}
          VERCEL_PROJECT_ID_WEB_STORE_MANAGER: ${{ secrets.VERCEL_PROJECT_ID_WEB_STORE_MANAGER }}
          VERCEL_PROJECT_ID_WEB_CAPTAIN: ${{ secrets.VERCEL_PROJECT_ID_WEB_CAPTAIN }}
          VERCEL_PROJECT_ID_WEB_ADMIN: ${{ secrets.VERCEL_PROJECT_ID_WEB_ADMIN }}
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for var in DATABASE_URL RENDER_API_KEY RENDER_SERVICE_ID VERCEL_TOKEN VERCEL_ORG_ID \
                      VERCEL_PROJECT_ID_WEB_CUSTOMER VERCEL_PROJECT_ID_WEB_CHECKOUT \
                      VERCEL_PROJECT_ID_WEB_STORE_DETAILS VERCEL_PROJECT_ID_WEB_ORDER_TRACKING \
                      VERCEL_PROJECT_ID_WEB_STORE_MANAGER VERCEL_PROJECT_ID_WEB_CAPTAIN \
                      VERCEL_PROJECT_ID_WEB_ADMIN; do
            if [ -z "${!var:-}" ]; then
              echo "::error::Missing required secret: $var"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "Required secrets: PASS"

      # ============================================================
      # 8. Run Database Migrations (Neon PostgreSQL)
      # ============================================================
      - name: Run Database Migrations
        working-directory: packages/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Deploying PostgreSQL migrations to Neon..."
          npx prisma migrate deploy --schema=prisma/schema.prisma

      # ============================================================
      # 9. Build frontend applications (all 7 SPAs)
      # ============================================================
      - name: Build Frontend Apps
        env:
          VITE_API_URL: ${{ secrets.PROD_API_URL }}
        shell: bash
        run: |
          set -euo pipefail

          for app in web-customer web-checkout web-store-details web-order-tracking web-store-manager web-captain web-admin; do
            echo "::group::Building @samou-go/$app"
            npm run build --workspace "@samou-go/$app"
            echo "::endgroup::"
          done

      # ============================================================
      # 10. Deploy API to Render
      # ============================================================
      - name: Deploy API to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Triggering Render deployment..."

          curl \
            --fail \
            --silent \
            --show-error \
            --request POST \
            --header "Authorization: Bearer ${RENDER_API_KEY}" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys"

          echo "Render deployment triggered successfully."

      # ============================================================
      # 11. Deploy SPAs to Vercel (prebuilt — uses dist/ we already built)
      # ============================================================
      - name: Deploy SPAs to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        shell: bash
        run: |
          set -euo pipefail

          declare -A PROJECT_IDS=(
            ["web-customer"]="${{ secrets.VERCEL_PROJECT_ID_WEB_CUSTOMER }}"
            ["web-checkout"]="${{ secrets.VERCEL_PROJECT_ID_WEB_CHECKOUT }}"
            ["web-store-details"]="${{ secrets.VERCEL_PROJECT_ID_WEB_STORE_DETAILS }}"
            ["web-order-tracking"]="${{ secrets.VERCEL_PROJECT_ID_WEB_ORDER_TRACKING }}"
            ["web-store-manager"]="${{ secrets.VERCEL_PROJECT_ID_WEB_STORE_MANAGER }}"
            ["web-captain"]="${{ secrets.VERCEL_PROJECT_ID_WEB_CAPTAIN }}"
            ["web-admin"]="${{ secrets.VERCEL_PROJECT_ID_WEB_ADMIN }}"
          )

          for app in web-customer web-checkout web-store-details web-order-tracking web-store-manager web-captain web-admin; do
            echo "::group::Deploying $app to Vercel"

            export VERCEL_PROJECT_ID="${PROJECT_IDS[$app]}"

            # Step 1: Link the project (creates .vercel/project.json in theme dir)
            (
              cd "themes/$app"

              npx --yes vercel@latest pull \
                --yes \
                --environment=production \
                --token "${VERCEL_TOKEN}"

              # Step 2: Skip `vercel build` — it runs the ROOT package.json build
              # script (tsc -b) instead of the theme's Vite build, producing no
              # dist/ folder. Instead, package the pre-built dist/ from step 9
              # into Vercel Build Output API v3 structure (.vercel/output/static/).
              mkdir -p .vercel/output/static
              cp -r dist/* .vercel/output/static/
              echo '{"version":3}' > .vercel/output/config.json

              # Step 3: Deploy the prebuilt output to Vercel.
              npx --yes vercel@latest deploy \
                --prebuilt \
                --prod \
                --yes \
                --token "${VERCEL_TOKEN}"
            )

            echo "::endgroup::"
          done

      # ============================================================
      # 12. Deployment summary
      # ============================================================
      - name: Deployment Summary
        if: success()
        run: |
          echo "=============================================="
          echo " Samou' Go Production Deployment: SUCCESS"
          echo "=============================================="