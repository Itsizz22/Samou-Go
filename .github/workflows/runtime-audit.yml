name: Audit Runtime Hosting
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect service plan without changing billing
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          node --input-type=module <<'JS'
          const response = await fetch(`https://api.render.com/v1/services/${process.env.RENDER_SERVICE_ID}`, {
            headers: {Authorization: `Bearer ${process.env.RENDER_API_KEY}`, Accept: 'application/json'}
          });
          if (!response.ok) throw new Error(`Render inspection HTTP ${response.status}`);
          const service = await response.json();
          console.log(JSON.stringify({name: service.name, type: service.type, suspended: service.suspended,
            plan: service.serviceDetails?.plan, instances: service.serviceDetails?.numInstances,
            region: service.serviceDetails?.region, healthCheckPath: service.serviceDetails?.healthCheckPath}));
          JS
