name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dummy_db

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Repository and dependency security
        run: |
          node scripts/check-repository-security.mjs
          npm audit --audit-level=moderate

      # 1. بناء الحزم المشتركة والـ UI أولاً وقبل كل شيء
      - name: Build Shared Packages & UI
        run: |
          npm run build --workspace @samou-go/shared-types --if-present
          npm run build --workspace @samou-go/ui --if-present

      # 2. الآن يمكننا تشغيل أوامر Prisma بأمان لأن الاعتماديات جاهزة
      - name: Prisma validate (production PostgreSQL schema)
        working-directory: packages/api
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Prisma validate (local dev SQLite schema)
        working-directory: packages/api
        run: npx prisma validate --schema=prisma/schema.sqlite.prisma

      - name: Prisma generate (production PostgreSQL client)
        working-directory: packages/api
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Prisma generate (local dev SQLite client)
        working-directory: packages/api
        run: npx prisma generate --schema=prisma/schema.sqlite.prisma

      - name: Run Typecheck
        run: npm run typecheck

      # Builds the shared packages, the API *and* all 7 Vite SPAs. `npm run build`
      # alone stops at shared-types/ui/api, which let broken `vite build`s reach
      # the production deploy workflow unnoticed.
      - name: Build All (packages + 7 SPAs)
        run: npm run build:all

      - name: Run Tests
        run: npm test

      - name: API unit tests
        run: npm run test --workspace @samou-go/api

      - name: Client and customer regressions
        run: |
          npm run test --workspace @samou-go/api-client
          npm run test --workspace @samou-go/web-customer

  postgres-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      validation-db:
        image: postgres:18
        env:
          POSTGRES_USER: validation
          POSTGRES_PASSWORD: validation-local-only
          POSTGRES_DB: samou_validation
        ports:
          - 55439:5432
        options: >-
          --health-cmd "pg_isready -U validation -d samou_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://validation:validation-local-only@127.0.0.1:55439/samou_validation
      SAMOU_VALIDATION_PG: postgresql://validation:validation-local-only@127.0.0.1:55439/samou_validation
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: mkdir -p outputs/launch-validation
      - name: Real PostgreSQL capacity and device-registration races
        run: npm run test --workspace @samou-go/api -- src/modules/orders/dispatch.postgres.test.ts
