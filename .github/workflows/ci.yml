name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dummy_db

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # 1. بناء الحزم المشتركة والـ UI أولاً وقبل كل شيء
      - name: Build Shared Packages & UI
        run: |
          npm run build --workspace @samou-go/shared-types --if-present
          npm run build --workspace @samou-go/ui --if-present

      # 2. الآن يمكننا تشغيل أوامر Prisma بأمان لأن الاعتماديات جاهزة
      - name: Prisma validate (production PostgreSQL schema)
        working-directory: packages/api
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Prisma validate (local dev SQLite schema)
        working-directory: packages/api
        run: npx prisma validate --schema=prisma/schema.sqlite.prisma

      - name: Prisma generate (production PostgreSQL client)
        working-directory: packages/api
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Prisma generate (local dev SQLite client)
        working-directory: packages/api
        run: npx prisma generate --schema=prisma/schema.sqlite.prisma

      - name: Run Typecheck
        run: npm run typecheck

      # Builds the shared packages, the API *and* all 7 Vite SPAs. `npm run build`
      # alone stops at shared-types/ui/api, which let broken `vite build`s reach
      # the production deploy workflow unnoticed.
      - name: Build All (packages + 7 SPAs)
        run: npm run build:all

      - name: Run Tests
        run: npm test

      - name: API unit tests
        run: npm run test --workspace @samou-go/api