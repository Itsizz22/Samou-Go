name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # Placeholder only — `prisma validate`/`generate` never connect to a
      # database, but the PostgreSQL schema resolves `env("DATABASE_URL")` and
      # the @prisma/client postinstall generates from it during `npm ci`.
      # Real production credentials are injected as deployment secrets.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dummy_db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm ci` runs the `prepare` scripts that build @samou-go/shared-types,
      # and @prisma/client's postinstall generates the client from the committed
      # production schema (`schema.prisma`, PostgreSQL). No database is needed.
      - run: npm ci

      - name: Prisma validate (production PostgreSQL schema)
        working-directory: packages/api
        run: npx prisma validate --schema=prisma/schema.prisma

      - name: Prisma generate (production PostgreSQL client)
        working-directory: packages/api
        run: npx prisma generate --schema=prisma/schema.prisma

      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: API unit tests
        run: npm run test --workspace @samou-go/api
