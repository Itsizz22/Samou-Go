# Manual iOS workflows: build-only release, simulator preview, and TestFlight upload.
workflows:
  ios-release: &ios_release
    name: Samou Quick iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment: &ios_release_environment
      node: 22
      xcode: "26.6"
      groups:
        - ios_credentials
      # Codemagic initializes the keychain and imports these uploaded files.
      ios_signing:
        certificates:
          - samou-quick-app-store-distribution
        provisioning_profiles:
          - profile: samou-quick-app-store-profile
            environment_variable: SAMOU_IOS_PROFILE_PATH
      vars: &ios_release_vars
        BUNDLE_ID: com.samougo.customer
        EXPECTED_APPLE_TEAM_NAME: Qais Amro
        IOS_BUILD_NUMBER_BASE: "1000"
        VITE_API_URL: https://samou-go.onrender.com/api/v1
    scripts:
      - name: Install locked Node dependencies
        script: |
          set -euo pipefail
          mkdir -p build/ios/logs
          if [ "${SAMOU_ASC_PREFLIGHT:-false}" = "true" ]; then
            node scripts/ios/asc-preflight.cjs 2>&1 | tee build/ios/logs/asc-preflight.log
          fi
          npm ci 2>&1 | tee build/ios/logs/npm.log
          git diff --exit-code -- package-lock.json
          python3 -m unittest discover -s scripts/ios -p 'test_*.py'
      - name: Validate inputs and install Firebase configuration
        script: |
          set -euo pipefail
          python3 scripts/ios/release.py prepare
          xcodebuild -version
      - name: Build Vite assets and sync Capacitor iOS
        script: |
          set -euo pipefail
          npm run build --workspace @samou-go/shared-types
          npm run cap:build:ios --workspace @samou-go/web-customer \
            2>&1 | tee build/ios/logs/web-capacitor.log
      - name: Resolve native Swift packages
        script: |
          set -euo pipefail
          # This checked-in project uses SPM, not CocoaPods or App.xcworkspace.
          test ! -f themes/web-customer/ios/App/Podfile
          xcodebuild -resolvePackageDependencies \
            -project themes/web-customer/ios/App/App.xcodeproj \
            -scheme App 2>&1 | tee build/ios/logs/spm.log
      - name: Validate selected signing identity and derive Apple team
        script: |
          set -euo pipefail
          python3 scripts/ios/signing_preflight.py \
            2>&1 | tee build/ios/logs/signing-preflight.log
      - name: Apply App Store signing and increment build number
        script: |
          set -euo pipefail
          python3 scripts/ios/release.py source
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/themes/web-customer/ios/App/App.xcodeproj" \
            --profile "$SAMOU_IOS_PROFILE_PATH" --archive-method app-store \
            --custom-export-options "{\"teamID\":\"$APPLE_TEAM_ID\",\"signingCertificate\":\"$IOS_SIGNING_IDENTITY\",\"manageAppVersionAndBuildNumber\":false,\"destination\":\"export\"}" \
            2>&1 | tee build/ios/logs/signing.log
          python3 scripts/ios/release.py signing
          python3 scripts/ios/release.py version
      - name: Archive Release and export signed App Store IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/themes/web-customer/ios/App/App.xcodeproj" \
            --scheme App --config Release --no-show-build-settings \
            --archive-directory build/ios/xcarchive \
            --ipa-directory build/ios/ipa \
            --export-options-plist "$HOME/export_options.plist" \
            --archive-xcargs "DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_IDENTITY=$IOS_SIGNING_IDENTITY COMPILER_INDEX_STORE_ENABLE=NO" \
            2>&1 | tee build/ios/logs/archive-export.log
      - name: Verify signed IPA and Firebase push configuration
        script: |
          set -euo pipefail
          python3 scripts/ios/release.py ipa \
            2>&1 | tee build/ios/logs/ipa-validation.log
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - build/ios/xcarchive/**/*.dSYM
      - build/ios/logs/*.log
      - /tmp/xcodebuild_logs/*.log

  ios-preview:
    name: Samou Quick iOS Preview
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      node: 22
      xcode: "26.6"
      groups:
        - ios_credentials
      vars:
        BUNDLE_ID: com.samougo.customer
        VITE_API_URL: https://samou-go.onrender.com/api/v1
    scripts:
      - name: Install dependencies and Firebase configuration
        script: |
          set -euo pipefail
          mkdir -p build/ios-preview/logs
          npm ci 2>&1 | tee build/ios-preview/logs/npm.log
          git diff --exit-code -- package-lock.json
          python3 scripts/ios/release.py prepare
      - name: Build Vite assets and sync Capacitor iOS
        script: |
          set -euo pipefail
          npm run build --workspace @samou-go/shared-types
          npm run cap:build:ios --workspace @samou-go/web-customer \
            2>&1 | tee build/ios-preview/logs/web-capacitor.log
      - name: Build unsigned iOS simulator app for App Preview
        script: |
          set -euo pipefail
          xcodebuild build \
            -project themes/web-customer/ios/App/App.xcodeproj \
            -scheme App -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$CM_BUILD_DIR/build/ios-preview/DerivedData" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tee build/ios-preview/logs/simulator.log
          test -d build/ios-preview/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          test -f build/ios-preview/DerivedData/Build/Products/Debug-iphonesimulator/App.app/public/index.html
          test -f build/ios-preview/DerivedData/Build/Products/Debug-iphonesimulator/App.app/Firebase/GoogleService-Info.plist
    artifacts:
      - build/ios-preview/DerivedData/Build/Products/Debug-iphonesimulator/*.app
      - build/ios-preview/logs/*.log

  ios-testflight:
    <<: *ios_release
    name: Samou Quick iOS TestFlight
    environment:
      <<: *ios_release_environment
      vars:
        <<: *ios_release_vars
        SAMOU_ASC_PREFLIGHT: "true"
    integrations:
      app_store_connect: Samou Quick
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

  ios-auth-check:
    name: Samou Quick Apple Authentication Check
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: Samou Quick
    environment:
      node: 22
      xcode: "26.6"
      groups:
        - ios_credentials
    scripts:
      - name: Verify runner integration against Apple without building or uploading
        script: |
          set -euo pipefail
          mkdir -p build/ios/logs
          node scripts/ios/asc-preflight.cjs 2>&1 | tee build/ios/logs/asc-preflight.log
    artifacts:
      - build/ios/logs/asc-preflight.log
