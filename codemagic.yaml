# Manual App Store IPA build. No App Store Connect API or publishing required.
workflows:
  ios-release:
    name: Samou Quick iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      node: 22
      xcode: "26.6"
      groups:
        - ios_credentials
      # Codemagic initializes the keychain and imports these uploaded files.
      ios_signing:
        certificates:
          - samou-quick-app-store-distribution
        provisioning_profiles:
          - profile: samou-quick-app-store-profile
            environment_variable: SAMOU_IOS_PROFILE_PATH
      vars:
        BUNDLE_ID: com.samougo.customer
        EXPECTED_APPLE_TEAM_NAME: Qais Amro
        IOS_BUILD_NUMBER_BASE: "1000"
        VITE_API_URL: https://samou-go.onrender.com/api/v1
    scripts:
      - name: Install locked Node dependencies
        script: |
          set -euo pipefail
          mkdir -p build/ios/logs
          npm ci 2>&1 | tee build/ios/logs/npm.log
          git diff --exit-code -- package-lock.json
          python3 -m unittest discover -s scripts/ios -p 'test_*.py'
      - name: Validate inputs and install Firebase configuration
        script: |
          set -euo pipefail
          python3 scripts/ios/release.py prepare
          xcodebuild -version
      - name: Build Vite assets and sync Capacitor iOS
        script: |
          set -euo pipefail
          npm run build --workspace @samou-go/shared-types
          npm run cap:build:ios --workspace @samou-go/web-customer \
            2>&1 | tee build/ios/logs/web-capacitor.log
      - name: Resolve native Swift packages
        script: |
          set -euo pipefail
          # This checked-in project uses SPM, not CocoaPods or App.xcworkspace.
          test ! -f themes/web-customer/ios/App/Podfile
          xcodebuild -resolvePackageDependencies \
            -project themes/web-customer/ios/App/App.xcodeproj \
            -scheme App 2>&1 | tee build/ios/logs/spm.log
      - name: Validate selected signing identity and derive Apple team
        script: |
          set -euo pipefail
          python3 scripts/ios/signing_preflight.py \
            2>&1 | tee build/ios/logs/signing-preflight.log
      - name: Apply App Store signing and increment build number
        script: |
          set -euo pipefail
          python3 scripts/ios/release.py source
          xcode-project use-profiles \
            --project "$CM_BUILD_DIR/themes/web-customer/ios/App/App.xcodeproj" \
            --profile "$SAMOU_IOS_PROFILE_PATH" --archive-method app-store \
            --custom-export-options "{\"teamID\":\"$APPLE_TEAM_ID\",\"signingCertificate\":\"$IOS_SIGNING_IDENTITY\",\"manageAppVersionAndBuildNumber\":false,\"destination\":\"export\"}" \
            2>&1 | tee build/ios/logs/signing.log
          python3 scripts/ios/release.py signing
          python3 scripts/ios/release.py version
      - name: Archive Release and export signed App Store IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/themes/web-customer/ios/App/App.xcodeproj" \
            --scheme App --config Release --no-show-build-settings \
            --archive-directory build/ios/xcarchive \
            --ipa-directory build/ios/ipa \
            --export-options-plist "$HOME/export_options.plist" \
            --archive-xcargs "DEVELOPMENT_TEAM=$APPLE_TEAM_ID CODE_SIGN_IDENTITY=$IOS_SIGNING_IDENTITY COMPILER_INDEX_STORE_ENABLE=NO" \
            2>&1 | tee build/ios/logs/archive-export.log
      - name: Verify signed IPA and Firebase push configuration
        script: |
          set -euo pipefail
          python3 scripts/ios/release.py ipa \
            2>&1 | tee build/ios/logs/ipa-validation.log
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/xcarchive/*.xcarchive
      - build/ios/xcarchive/**/*.dSYM
      - build/ios/logs/*.log
      - /tmp/xcodebuild_logs/*.log
